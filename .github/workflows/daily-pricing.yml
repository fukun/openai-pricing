name: Collect OpenAI model pricing

on:
  push:
    branches: [main]
  schedule:
    # 08:00 China Standard Time (UTC+8), every day.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Collect Standard and Batch prices
        run: node collect_pricing.mjs
      - name: Save updated history
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data/pricing_history.jsonl data/collection_log.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pricing_history.jsonl data/collection_log.jsonl
            git commit -m "Record OpenAI pricing collection for $(date -u +%F)"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare static site
        run: |
          mkdir -p dist/data
          cp index.html app.js styles.css dist/
          cp data/pricing_history.jsonl data/collection_log.jsonl dist/data/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
