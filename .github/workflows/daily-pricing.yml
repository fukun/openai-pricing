name: Collect model pricing

on:
  push:
    branches: [main]
  schedule:
    # 08:17 China Standard Time (UTC+8), away from the hourly scheduling peak.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: model-pricing-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build provider pages
        run: node build_pages.mjs
      - name: Check pricing parsers and history storage
        run: node --test tests/pricing.test.mjs
      - name: Collect all four providers
        id: collection
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_EMAIL_RESULT: "1"
        run: node collect_all.mjs
      - name: Save updated history
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Record model pricing collection for $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html app.js styles.css price_values.mjs dist/
          cp -R data deepseek claude gemini dist/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Report collection or archive failure after publishing logs
        if: steps.collection.outcome == 'failure'
        run: exit 1
