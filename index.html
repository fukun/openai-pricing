<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <meta name="description" content="OpenAI GPT-5 及以上模型 API 价格历史">
    <title>OpenAI API 价格历史</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="OpenAI API 价格历史首页">
          <span class="brand-mark">O</span>
          <span>价格观察</span>
        </a>
        <a class="source-link" href="https://developers.openai.com/api/docs/pricing?latest-pricing=batch" target="_blank" rel="noreferrer">OpenAI 官方价格 ↗</a>
      </header>

      <section class="intro">
        <div class="eyebrow"><span class="live-dot"></span> GPT-5+ API PRICING</div>
        <h1>模型价格历史</h1>
        <p>追踪 OpenAI GPT-5 及以上模型的 Standard 和 Batch 价格变化。</p>
      </section>

      <section class="summary" aria-label="数据概览">
        <article class="summary-card"><span>模型数量</span><strong id="model-count">—</strong><small>GPT-5 及以上</small></article>
        <article class="summary-card"><span>价格记录</span><strong id="record-count">—</strong><small>Standard + Batch</small></article>
        <article class="summary-card"><span>最近更新</span><strong id="latest-date">—</strong><small>UTC</small></article>
      </section>

      <section class="workspace">
        <div class="toolbar">
          <div class="view-switch" role="tablist" aria-label="展示方式">
            <button class="view-button active" data-view="list" role="tab" aria-selected="true">☷ <span>列表</span></button>
            <button class="view-button" data-view="chart" role="tab" aria-selected="false">⌁ <span>图表</span></button>
          </div>
          <div class="filters">
            <div class="model-filter">
              <label for="model-search">搜索模型</label>
              <input id="model-search" type="search" placeholder="输入模型名" autocomplete="off">
              <label for="model-filter">模型</label>
              <select id="model-filter"><option value="all">全部模型</option></select>
            </div>
            <label>价格类型<select id="mode-filter"><option value="all">全部类型</option><option>Standard</option><option>Batch</option></select></label>
            <label>从日期<input id="from-filter" type="date"></label>
            <label>到日期<input id="to-filter" type="date"></label>
          </div>
        </div>

        <div id="list-view" class="view-panel">
          <div class="panel-heading">
            <div><h2>价格记录</h2><p>按日期查看每日采集到的价格行</p></div>
            <div class="panel-actions"><span id="visible-count" class="count-pill">0 条</span><button id="export-csv" class="export-button" type="button">导出 CSV</button></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>日期</th><th>模型</th><th>类型</th><th>价格明细 <span class="unit-note">官网原始列顺序</span></th><th>Wayback</th></tr></thead>
              <tbody id="price-rows"><tr><td colspan="5" class="empty">正在读取价格历史…</td></tr></tbody>
            </table>
          </div>
        </div>

        <div id="chart-view" class="view-panel" hidden>
          <div class="panel-heading chart-heading">
            <div><h2>价格走势</h2><p>比较模型在所选价格类型和价格列下的每日变化</p></div>
            <label class="metric-select">价格列<select id="metric-filter"></select></label>
          </div>
          <div class="chart-wrap"><canvas id="price-chart" aria-label="模型价格历史折线图"></canvas></div>
          <div id="chart-legend" class="legend"></div>
          <p id="chart-empty" class="empty chart-empty" hidden>当前筛选条件没有可绘制的价格数据。</p>
        </div>
      </section>

      <footer><span id="status">正在载入数据…</span><span>价格单位以官方页面为准 · <a href="https://developers.openai.com/api/docs/pricing?latest-pricing=batch" target="_blank" rel="noreferrer">来源与说明</a></span></footer>
    </main>
  </body>
</html>
